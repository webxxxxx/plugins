<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<title>hello-rust</title>
<style>
  body { font: 14px/1.6 system-ui, sans-serif; margin: 2rem; max-width: 46rem; }
  pre { background: #f4f4f4; padding: .8rem; border-radius: 6px; min-height: 2rem; }
  code { background: #f4f4f4; padding: .1rem .3rem; border-radius: 4px; }
  .row { display: flex; gap: .5rem; margin: .8rem 0; }
  input { flex: 1; padding: .4rem .6rem; }
</style>

<h1>hello-rust</h1>
<p>状态：<code id="status">连接中…</code></p>
<p>这个页面没有自己的 HTTP 服务：静态文件由 svcd 反代，能力调用走 <code>POST ./rpc</code>，
事件推送走 <code>./events</code>（SSE）。</p>

<div class="row">
  <input id="message" value="hello from the browser">
  <button id="echo">echo</button>
  <button id="stats">stats</button>
</div>
<pre id="out">（等待调用）</pre>
<pre id="feed">（等待 tick 事件）</pre>

<script type="module">
  import { pluginUI } from './plugin-ui.mjs';

  const ui = pluginUI();
  const out = document.getElementById('out');
  const feed = document.getElementById('feed');
  const status = document.getElementById('status');

  const show = (promise) =>
    promise.then(
      (text) => { out.textContent = text; },
      (error) => { out.textContent = `error ${error.code ?? ''}: ${error.message}`; },
    );

  document.getElementById('echo').onclick = () =>
    show(ui.invoke('echo', { message: document.getElementById('message').value }));
  document.getElementById('stats').onclick = () => show(ui.invoke('stats'));

  show(ui.invoke('stats'));

  let ticks = 0;
  ui.subscribe({
    onMessage(method, params) {
      if (method === 'notifications/message' && params?.type === 'tick') {
        ticks += 1;
        feed.textContent = `tick #${params.count}（本页收到 ${ticks} 条）`;
      }
    },
    onReset() {
      // 宿主没能回放历史：重新拉一次状态，别假设页面上的数字还对。
      status.textContent = '历史不可回放，已重新同步';
      show(ui.invoke('stats'));
    },
  });

  status.textContent = '已连接';
</script>
</html>

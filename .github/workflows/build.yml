name: build

# Builds the host's `plugin` CLI, then packages every reference sample with it
# and verifies the result. The samples are the gate: if a template or an SDK
# stops producing a valid .spk, this is where it shows up.

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: host / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          # The host repository provides `plugin bundle` / `plugin verify`.
          # Literal on purpose: the `env` context is not available in `with:`.
          repository: webxxxxx/plugin-manager
          path: host
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host -> target
          key: host-${{ matrix.os }}
      - name: Build the host CLI
        working-directory: host
        run: cargo build --locked
      - name: Stage it as the `plugin` entry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          if [ -f host/target/debug/svcd.exe ]; then
            cp host/target/debug/svcd.exe bin/plugin.exe
          else
            cp host/target/debug/svcd bin/plugin
            chmod +x bin/plugin
          fi
          ls -l bin
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-${{ matrix.os }}
          path: bin/
          if-no-files-found: error
          retention-days: 7

  package:
    name: package / ${{ matrix.sample }} / ${{ matrix.os }}
    needs: host
    strategy:
      fail-fast: false
      # Native builds on the runner's own triple; cross-compiling would need a
      # toolchain the templates deliberately do not assume. The C sample stays on
      # Linux because a Windows runner has no supported C toolchain of its own.
      matrix:
        include:
          - { os: ubuntu-24.04, sample: hello-rust, platform: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04, sample: hello-c, platform: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04, sample: hello-shell, platform: x86_64-unknown-linux-gnu }
          - { os: windows-2025, sample: hello-rust, platform: x86_64-pc-windows-msvc }
          - { os: windows-2025, sample: hello-shell, platform: x86_64-pc-windows-msvc }
          - { os: windows-2025, sample: hello-powershell, platform: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: plugin-${{ matrix.os }}
          path: bin
      - name: Restore the exec bit
        shell: bash
        # Artifacts do not preserve file modes; without this the Linux jobs fail
        # with "bin/plugin: Permission denied".
        run: |
          if [ -f bin/plugin ]; then chmod +x bin/plugin; fi
          ls -l bin
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/cli -> target
          key: tools-${{ matrix.os }}
      - name: Build plugin-tools
        run: cargo build --locked --release --manifest-path tools/cli/Cargo.toml
      - name: Package the sample
        shell: bash
        env:
          SVCD_PLUGIN_BIN: ${{ github.workspace }}/bin/plugin${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          set -euo pipefail
          tools="tools/cli/target/release/plugin-tools"
          if [ -x "$tools.exe" ]; then tools="$tools.exe"; fi
          cd "samples/${{ matrix.sample }}"
          "../../$tools" build --platform "${{ matrix.platform }}"
      - name: Verify the packaged sample
        shell: bash
        env:
          SVCD_PLUGIN_BIN: ${{ github.workspace }}/bin/plugin${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          set -euo pipefail
          # `verify --json` must say ok, and the display name in the artifact must
          # still be the Chinese name the sample's manifest declares.
          expected=$(jq -r '.name' "samples/${{ matrix.sample }}/package/manifest.json")
          for spk in "samples/${{ matrix.sample }}"/dist/*.spk; do
            report=$("$SVCD_PLUGIN_BIN" verify "$spk" --json)
            echo "$report" | jq -e '.ok == true' > /dev/null
            actual=$(echo "$report" | jq -r '.displayName')
            if [ "$actual" != "$expected" ]; then
              echo "::error::displayName \"$actual\" != manifest name \"$expected\" in $spk"
              exit 1
            fi
          done

      - name: Package a freshly scaffolded template
        if: matrix.sample == 'hello-shell'
        shell: bash
        env:
          SVCD_PLUGIN_BIN: ${{ github.workspace }}/bin/plugin${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          set -euo pipefail
          tools="tools/cli/target/release/plugin-tools"
          if [ -x "$tools.exe" ]; then tools="$tools.exe"; fi
          "$tools" template smoke-shell --lang shell --platforms "${{ matrix.platform }}" --dir .scaffold
          spk=".scaffold/smoke-shell/dist/smoke-shell-0.1.0-${{ matrix.platform }}.spk"
          (cd .scaffold/smoke-shell && "../../$tools" build)
          "$tools" check "$spk"

      - uses: actions/upload-artifact@v7
        with:
          name: spk-${{ matrix.sample }}-${{ matrix.os }}
          path: samples/${{ matrix.sample }}/dist/*.spk
          if-no-files-found: error
          retention-days: 7

name: test

# Everything in this repo is Rust now (the toolchain, the SDK, the samples), so
# the test job is the same on both operating systems. The scaffold smoke step
# proves both templates still lay down a project on the platform in question.

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            sdk/rust -> target
            tools/cli -> target
            samples/hello-rust -> target
          key: test-${{ matrix.os }}

      - name: SDK tests
        working-directory: sdk/rust
        run: cargo test --locked

      - name: Toolchain tests
        working-directory: tools/cli
        run: cargo test --locked

      - name: Reference sample tests
        working-directory: samples/hello-rust
        run: cargo test --locked

      # Cheap repo-wide guardrails: payload scripts parse and are LF, vendor/
      # only commits source (prebuilt kernel modules live under vendor/prebuilt),
      # and the release matrix builder has its own tests instead of running
      # first at tag time.
      - name: Repo guardrails
        shell: bash
        run: |
          set -euo pipefail
          py=
          for candidate in python3 python; do
            if command -v "$candidate" >/dev/null 2>&1 && "$candidate" -c '' >/dev/null 2>&1; then
              py=$candidate
              break
            fi
          done
          [ -n "$py" ] || { echo "::error::no working python found"; exit 1; }
          "$py" tools/check-shell.py
          "$py" tools/check-vendor.py
          ( cd tools/ci && "$py" -m unittest -q test_matrix )

      # The plugin-store page's space pre-check lives in the page source; this
      # extracts the real function and runs it with a stubbed host, so the
      # "can this upgrade fit" decision is covered without a browser.
      - name: plugin-store page checks
        run: node plugins/plugin-store/tests/disk-plan.mjs

      - name: Build plugin-tools
        run: cargo build --locked --manifest-path tools/cli/Cargo.toml

      # `.plugin.json` is the project's own identity record (it drives the
      # release matrix and the per-plugin workflow); it has to name the same
      # plugin the manifest does.
      - name: Project metadata matches the manifest
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for dir in samples/* plugins/*; do
            [ -f "$dir/.plugin.json" ] || continue
            [ -f "$dir/package/manifest.json" ] || continue
            id=$(jq -r '.id // empty' "$dir/package/manifest.json")
            name=$(jq -r '.name // empty' "$dir/.plugin.json")
            if [ "$name" != "$id" ]; then
              echo "::error::$dir/.plugin.json name \"$name\" != manifest id \"$id\""
              failed=1
            fi
          done
          exit "$failed"

      - name: Scaffold every template
        shell: bash
        run: |
          set -euo pipefail
          tools="tools/cli/target/debug/plugin-tools"
          if [ -x "$tools.exe" ]; then tools="$tools.exe"; fi
          # 平台决定可选语言：shell 只出 unix，跨家族只有 rust/c/script。
          scaffold() {
            language=$1
            platforms=$2
            "$tools" template "smoke-$language" --lang "$language" --ui web \
              --platforms "$platforms" --dir .scaffold --force
          }
          scaffold rust x86_64-unknown-linux-musl
          scaffold c x86_64-unknown-linux-musl
          scaffold shell x86_64-unknown-linux-musl
          scaffold powershell x86_64-pc-windows-msvc
          scaffold script x86_64-unknown-linux-musl,x86_64-pc-windows-msvc
          for language in rust c shell powershell script; do
            test -f ".scaffold/smoke-$language/package/manifest.json"
            test -f ".scaffold/smoke-$language/build.json"
            test -f ".scaffold/smoke-$language/.plugin.json"
            # Generated manifests are already on manifest schema 1 with an ASCII
            # id; a template that regresses here fails before packaging.
            manifest=".scaffold/smoke-$language/package/manifest.json"
            test "$(jq -r '.schema' "$manifest")" = "1"
            id=$(jq -r '.id // empty' "$manifest")
            printf '%s' "$id" | grep -Eq '^[a-z0-9][a-z0-9_-]{0,63}$' || {
              echo "::error::template $language wrote a bad id: $id"
              exit 1
            }
          done
          # The web toolkit must have been vendored, not referenced.
          test -f .scaffold/smoke-rust/package/payload/web/plugin-ui.mjs
          # The shell SDK is vendored into the package; the PowerShell module is not.
          test -f .scaffold/smoke-shell/package/payload/lib/svcd-plugin.sh
          if [ -f .scaffold/smoke-shell/package/payload/lib/SvcdPlugin.ps1 ]; then
            echo '::error::shell plugin must not ship the PowerShell module'
            exit 1
          fi
          # `script` ships both scripts and both SDKs as source, one per family,
          # outside package/ — the build picks the family's half.
          test -f .scaffold/smoke-script/platforms/smoke-script.sh
          test -f .scaffold/smoke-script/platforms/smoke-script.ps1
          test -f .scaffold/smoke-script/platforms/lib/svcd-plugin.sh
          test -f .scaffold/smoke-script/platforms/lib/SvcdPlugin.ps1
          test -f .scaffold/smoke-script/platforms/unix.json
          test -f .scaffold/smoke-script/platforms/windows.json
          if [ -d .scaffold/smoke-script/package/payload/lib ]; then
            echo '::error::a script project must not vendor the SDK inside package/'
            exit 1
          fi
          # A single-family project keeps its entry in the shared manifest.
          test -f .scaffold/smoke-shell/package/payload/bin/smoke-shell.sh
          if [ -d .scaffold/smoke-shell/platforms ]; then
            echo '::error::a single-family project must not split its manifest'
            exit 1
          fi

      # meow 的配置层：config（我们的开关）和 meow.yaml（订阅）分开，受管键按
      # proxy-mode 自动写。两个假布局脚本各自验证一侧，都不需要真的启动 meow。
      - name: meow 配置层（shell）
        shell: bash
        run: sh tools/meow-config-test.sh

      # 生命周期脚本的收尾契约（svcd #323）：stop 在进程消失之后才跑，只收尾、不杀进程；
      # 强杀/断电留下的 pidfile 里那个 pid 可能已经被复用，status 不能把它当成自己。
      - name: 生命周期脚本（收尾）
        if: runner.os == 'Linux'
        shell: bash
        run: sh tools/lifecycle-test.sh

      - name: meow 配置层（PowerShell）
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/meow-config-test.ps1

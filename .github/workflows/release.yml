name: release

# 发布规则：
#   v<version>              -> 项目 plugin-tools + plugins/ 下全部插件
#   <plugin>-v<version>     -> 只发布该插件（版本必须与插件 manifest 一致）
# PR 只构建校验，不发布；workflow_dispatch 可手动选择 all 或单个插件。

on:
  push:
    tags: ["v*", "*-v*"]
  pull_request:
    paths:
      - "plugins/**"
      - "tools/cli/**"
      - "sdk/**"
      - "templates/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0 or hysteria-v1.0.1 (required when release=true)"
        required: false
      plugin:
        description: "all, or one plugin directory name (hysteria / meow / sshd)"
        required: false
        default: "all"
      release:
        description: "Create or update a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
      filter: ${{ steps.scope.outputs.filter }}
      has_plugins: ${{ steps.matrix.outputs.has_plugins }}
    steps:
      - uses: actions/checkout@v7
      - id: scope
        name: Determine release scope
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_PLUGIN: ${{ github.event.inputs.plugin }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then tag="$GITHUB_REF_NAME"; fi
          requested="${INPUT_PLUGIN:-all}"
          filter=""
          case "$tag" in
            *-v*) filter="${tag%%-v*}" ;;
          esac
          if [ -n "$requested" ] && [ "$requested" != "all" ]; then filter="$requested"; fi
          if [ -z "$filter" ]; then filter=all; fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            filter=changed
          fi

          if [ "${{ github.event.inputs.release }}" = "true" ] && [ -z "${{ github.event.inputs.tag }}" ]; then
            echo "::error::workflow_dispatch release requires a tag input"
            exit 1
          fi

          if [ "$filter" != "all" ] && [ "$filter" != "changed" ]; then
            if [ ! -f "plugins/$filter/.plugin.json" ]; then
              echo "::error::unknown plugin '$filter' (no plugins/$filter/.plugin.json)"
              exit 1
            fi
            is_release=false
            if [ "$GITHUB_REF_TYPE" = "tag" ] || [ "${{ github.event.inputs.release }}" = "true" ]; then
              is_release=true
            fi
            if [ "$is_release" = true ]; then
              case "$tag" in
                "$filter"-v*) ;;
                *)
                  echo "::error::per-plugin release tag must look like $filter-v<version>, got $tag"
                  exit 1
                  ;;
              esac
              version="${tag#"$filter"-v}"
              base="${version%%-*}"
              manifest_version=$(jq -r '.version // empty' "plugins/$filter/package/manifest.json")
              if [ -z "$manifest_version" ] || [ "$base" != "$manifest_version" ]; then
                echo "::error::tag version $base does not match plugins/$filter/package/manifest.json version $manifest_version"
                exit 1
              fi
            fi
          fi

          echo "filter=$filter" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - id: version
        name: Read plugin-tools version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' tools/cli/Cargo.toml | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::could not read the version from tools/cli/Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: matrix
        name: Build the plugin/platform matrix
        shell: bash
        env:
          FILTER: ${{ steps.scope.outputs.filter }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          changed=""
          build_all=false
          if [ "$FILTER" = "changed" ]; then
            if [ -z "$PR_NUMBER" ]; then
              echo "::error::changed scope requires a pull_request event"
              exit 1
            fi
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')
            # A build-tool/SDK change can affect every plugin; fall back to the full matrix.
            if printf '%s\n' "$files" | grep -qE '^(sdk|templates|tools/cli)/'; then
              build_all=true
            fi
            changed=$(printf '%s\n' "$files" | sed -n 's#^plugins/\([^/]*\)/.*#\1#p' | sort -u | tr '\n' ' ')
          fi

          entries='[]'
          for dir in plugins/*/; do
            plugin_dir="${dir%/}"
            plugin_name="${plugin_dir#plugins/}"
            include=false
            if [ "$FILTER" = "all" ] || [ "$build_all" = true ]; then
              include=true
            elif [ "$FILTER" = "changed" ]; then
              case " $changed " in *" $plugin_name "*) include=true ;; esac
            elif [ "$plugin_dir" = "plugins/$FILTER" ]; then
              include=true
            fi
            [ "$include" = true ] || continue

            manifest="${dir}.plugin.json"
            [ -f "$manifest" ] || continue
            name=$(jq -r '.name // empty' "$manifest")
            [ -n "$name" ] || continue
            platforms=$(jq -r '(.ci.platforms // .platforms // [])[]' "$manifest")
            for platform in $platforms; do
              case "$platform" in
                *-apple-darwin) os=macos-15 ;;
                *-windows-*)     os=windows-2025 ;;
                *)               os=ubuntu-24.04 ;;
              esac
              entries=$(jq -c \
                --arg plugin "$name" \
                --arg dir "$plugin_dir" \
                --arg platform "$platform" \
                --arg os "$os" \
                '. + [{plugin: $plugin, dir: $dir, platform: $platform, os: $os}]' \
                <<<"$entries")
            done
          done
          if [ "$entries" = "[]" ]; then
            if [ "$FILTER" = "changed" ]; then
              echo "has_plugins=false" >> "$GITHUB_OUTPUT"
              echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
              echo "no changed plugins; skipping the plugin matrix"
              exit 0
            fi
            echo "::error::no plugins with a .plugin.json were found"
            exit 1
          fi
          echo "has_plugins=true" >> "$GITHUB_OUTPUT"
          echo "matrix={\"include\":$entries}" >> "$GITHUB_OUTPUT"

  host:
    name: host tools / ${{ matrix.os }}
    needs: preflight
    if: needs.preflight.outputs.has_plugins == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/cli -> target
          key: host-tools-${{ matrix.os }}
      - name: Build plugin-tools and the host CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path tools/cli/Cargo.toml
          cargo install --locked --git https://github.com/webxxxxx/plugin-manager --bin svcd --root "$RUNNER_TEMP/host"
          mkdir -p bin
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp tools/cli/target/release/plugin-tools.exe bin/plugin-tools.exe
            cp "$RUNNER_TEMP/host/bin/svcd.exe" bin/plugin.exe
            chmod +x bin/plugin.exe bin/plugin-tools.exe
          else
            cp tools/cli/target/release/plugin-tools bin/plugin-tools
            cp "$RUNNER_TEMP/host/bin/svcd" bin/plugin
            chmod +x bin/plugin bin/plugin-tools
          fi
          ls -l bin
      - uses: actions/upload-artifact@v7
        with:
          name: host-${{ matrix.os }}
          path: bin/
          if-no-files-found: error
          retention-days: 7

  project:
    name: plugin-tools / ${{ matrix.target }}
    needs: preflight
    if: needs.preflight.outputs.filter == 'all'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, kind: linux }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, kind: windows }
          - { os: macos-15, target: universal2-apple-darwin, kind: macos }
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Add macOS targets
        if: matrix.kind == 'macos'
        shell: bash
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/cli -> target
          key: project-${{ matrix.target }}
      - name: Build (Linux)
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path tools/cli/Cargo.toml
          mkdir -p dist/stage
          cp tools/cli/target/release/plugin-tools dist/stage/
          cp README.md LICENSE dist/stage/
          tar -C dist/stage -czf "dist/plugin-tools-${VERSION}-${TARGET}.tar.gz" .
          rm -rf dist/stage
      - name: Build (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          cargo build --locked --release --target ${{ matrix.target }} --manifest-path tools/cli/Cargo.toml
          New-Item -ItemType Directory -Force dist/stage | Out-Null
          Copy-Item "tools/cli/target/${{ matrix.target }}/release/plugin-tools.exe" dist/stage/
          Copy-Item README.md, LICENSE dist/stage/
          Compress-Archive -Path "dist/stage/*" -DestinationPath "dist/plugin-tools-${env:VERSION}-${env:TARGET}.zip"
          Remove-Item -Recurse -Force dist/stage
      - name: Build (macOS universal)
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path tools/cli/Cargo.toml --target aarch64-apple-darwin
          cargo build --locked --release --manifest-path tools/cli/Cargo.toml --target x86_64-apple-darwin
          mkdir -p dist/stage
          lipo -create \
            tools/cli/target/aarch64-apple-darwin/release/plugin-tools \
            tools/cli/target/x86_64-apple-darwin/release/plugin-tools \
            -output dist/stage/plugin-tools
          chmod 755 dist/stage/plugin-tools
          lipo -info dist/stage/plugin-tools
          cp README.md LICENSE dist/stage/
          tar -C dist/stage -czf "dist/plugin-tools-${VERSION}-${TARGET}.tar.gz" .
          rm -rf dist/stage
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-tools-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  plugins:
    name: ${{ matrix.plugin }} / ${{ matrix.platform }}
    needs: [preflight, host]
    if: needs.preflight.outputs.has_plugins == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: host-${{ matrix.os }}
          path: bin
      - name: Add host tools to PATH
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            chmod +x bin/plugin.exe bin/plugin-tools.exe
            echo "SVCD_PLUGIN_BIN=$GITHUB_WORKSPACE/bin/plugin.exe" >> "$GITHUB_ENV"
          else
            chmod +x bin/plugin bin/plugin-tools
            echo "SVCD_PLUGIN_BIN=$GITHUB_WORKSPACE/bin/plugin" >> "$GITHUB_ENV"
          fi
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
      - name: Install Rust (meow/plugin-store)
        if: matrix.plugin == 'meow' || matrix.plugin == 'plugin-store'
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.platform }}
      - name: Install Go (hysteria only)
        if: matrix.plugin == 'hysteria'
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang libssl-dev pkg-config make perl curl xz-utils
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: brew install cmake
      - name: Install musl cross toolchains (sshd/meow/plugin-store)
        if: runner.os == 'Linux' && (matrix.plugin == 'sshd' || matrix.plugin == 'meow' || matrix.plugin == 'plugin-store') && (matrix.platform == 'aarch64-unknown-linux-musl' || matrix.platform == 'armv7-unknown-linux-musleabihf' || matrix.platform == 'x86_64-unknown-linux-musl')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cross"
          case "${{ matrix.platform }}" in
            aarch64-unknown-linux-musl)
              dir=aarch64-linux-musl-cross
              cc=aarch64-linux-musl-gcc
              cargo_key=AARCH64_UNKNOWN_LINUX_MUSL
              cc_key=aarch64_unknown_linux_musl
              ;;
            armv7-unknown-linux-musleabihf)
              dir=arm-linux-musleabihf-cross
              cc=arm-linux-musleabihf-gcc
              cargo_key=ARMV7_UNKNOWN_LINUX_MUSLEABIHF
              cc_key=armv7_unknown_linux_musleabihf
              ;;
            x86_64-unknown-linux-musl)
              dir=x86_64-linux-musl-cross
              cc=x86_64-linux-musl-gcc
              cargo_key=X86_64_UNKNOWN_LINUX_MUSL
              cc_key=x86_64_unknown_linux_musl
              ;;
          esac
          file="$dir.tgz"
          tgz="$RUNNER_TEMP/$file"
          ok=0
          # musl.cc 在 GitHub runner 上不可达，优先用 GitHub Release 镜像，最后回退主站。
          for base in \
            https://github.com/musl-cc/musl.cc/releases/download/v0.0.1 \
            https://github.com/tsl0922/musl-toolchains/releases/download/2021-11-23 \
            https://musl.cc; do
            if curl -fL --connect-timeout 10 --max-time 300 --retry 2 --retry-delay 3 -o "$tgz" "$base/$file" \
              && tar tzf "$tgz" >/dev/null 2>&1; then
              ok=1
              break
            fi
            rm -f "$tgz"
          done
          if [ "$ok" != 1 ]; then
            echo "::error::could not download $file"
            exit 1
          fi
          tar xzf "$tgz" -C "$RUNNER_TEMP/cross"
          rm -f "$tgz"
          echo "CROSS_PREFIX=$RUNNER_TEMP/cross/$dir" >> "$GITHUB_ENV"
          echo "AARCH64_CROSS=$RUNNER_TEMP/cross/aarch64-linux-musl-cross" >> "$GITHUB_ENV"
          echo "X86_64_MUSL_CROSS=$RUNNER_TEMP/cross/x86_64-linux-musl-cross" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${cargo_key}_LINKER=$RUNNER_TEMP/cross/$dir/bin/$cc" >> "$GITHUB_ENV"
          echo "CC_${cc_key}=$RUNNER_TEMP/cross/$dir/bin/$cc" >> "$GITHUB_ENV"
          echo "CXX_${cc_key}=$RUNNER_TEMP/cross/$dir/bin/${cc%gcc}g++" >> "$GITHUB_ENV"
          echo "AR_${cc_key}=$RUNNER_TEMP/cross/$dir/bin/${cc%gcc}ar" >> "$GITHUB_ENV"
          echo "RANLIB_${cc_key}=$RUNNER_TEMP/cross/$dir/bin/${cc%gcc}ranlib" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/cross/$dir/bin" >> "$GITHUB_PATH"
      - name: Build unsigned .spk
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ matrix.dir }}"
          plugin-tools build --platform "${{ matrix.platform }}"
      - name: Package the unsigned payload
        shell: bash
        run: |
          set -euo pipefail
          tar -C "${{ matrix.dir }}" -czf pkg.tgz package
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.plugin }}-${{ matrix.platform }}
          path: pkg.tgz
          if-no-files-found: error
          retention-days: 7

  sign:
    name: sign release
    needs: [preflight, host, plugins]
    if: |
      !cancelled()
      && needs.preflight.outputs.has_plugins == 'true'
      && needs.plugins.result == 'success'
      && (startsWith(github.ref, 'refs/tags/') || github.event.inputs.release == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # 建议在仓库 Settings -> Environments 里给 release 配 required reviewers。
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: host-ubuntu-24.04
          path: bin
      - uses: actions/download-artifact@v5
        with:
          path: pkgs
          pattern: pkg-*
      - name: Sign and verify .spk
        env:
          # 只有这个 job 的这一步能看到发布钥；上面的构建 job 完全没有。
          PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PLUGIN_SIGNING_KEY:-}" ]; then
            echo "::error::PLUGIN_SIGNING_KEY is required for a release build"
            exit 1
          fi
          chmod +x bin/plugin
          umask 077
          printf '%s' "$PLUGIN_SIGNING_KEY" > "$RUNNER_TEMP/signing.pem"
          trap 'rm -f "$RUNNER_TEMP/signing.pem" "$RUNNER_TEMP/signing.pub"' EXIT
          openssl pkey -in "$RUNNER_TEMP/signing.pem" -pubout -out "$RUNNER_TEMP/signing.pub"
          mkdir -p dist
          signed=0
          for archive in pkgs/*/pkg.tgz; do
            [ -f "$archive" ] || continue
            dir=$(basename "$(dirname "$archive")")
            tmp=$(mktemp -d)
            tar -xzf "$archive" -C "$tmp"
            manifest="$tmp/package/manifest.json"
            name=$(jq -r '.name // empty' "$manifest")
            version=$(jq -r '.version // empty' "$manifest")
            platform="${dir#pkg-$name-}"
            if [ -z "$name" ] || [ -z "$version" ] || [ "$platform" = "$dir" ] || [ -z "$platform" ]; then
              echo "::error::bad package artifact $dir (name=$name version=$version platform=$platform)"
              exit 1
            fi
            out="dist/${name}-${version}-${platform}.spk"
            bin/plugin bundle "$tmp/package" --platform "$platform" --key "$RUNNER_TEMP/signing.pem" -o "$out"
            bin/plugin verify "$out" --pubkey "$RUNNER_TEMP/signing.pub"
            rm -rf "$tmp"
            signed=$((signed + 1))
          done
          if [ "$signed" -lt 1 ]; then
            echo "::error::no packages were signed"
            exit 1
          fi
          ls -lh dist
      - uses: actions/upload-artifact@v7
        with:
          name: spk-signed
          path: dist/*.spk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    needs: [preflight, sign, project]
    if: |
      !cancelled()
      && needs.preflight.result == 'success'
      && needs.sign.result == 'success'
      && (needs.project.result == 'success' || needs.project.result == 'skipped')
      && (startsWith(github.ref, 'refs/tags/') || github.event.inputs.release == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: spk-*
          merge-multiple: true
      - uses: actions/download-artifact@v5
        if: needs.project.result == 'success'
        with:
          path: dist
          pattern: plugin-tools-*
          merge-multiple: true
      - name: Add the release public key
        shell: bash
        run: |
          if [ -f docs/release-key.pub ]; then
            cp docs/release-key.pub dist/
          fi
      - name: Verify the artifact set
        shell: bash
        env:
          FILTER: ${{ needs.preflight.outputs.filter }}
        run: |
          set -euo pipefail
          ls -lh dist
          spk=$(find dist -maxdepth 1 -type f -name '*.spk' | wc -l | tr -d ' ')
          tool=$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d ' ')
          if [ "$spk" -lt 1 ]; then
            echo "::error::no plugin .spk was produced (spk=$spk)"
            exit 1
          fi
          if [ "$FILTER" = "all" ] && [ "$tool" -lt 1 ]; then
            echo "::error::expected plugin-tools archives for a full release (tool=$tool)"
            exit 1
          fi
      - name: Write SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f \( -name '*.spk' -o -name '*.tar.gz' -o -name '*.zip' -o -name '*.pub' \) -printf '%f\n' \
            | sort | xargs -r sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG"
          if [ -z "$tag" ]; then tag="$GITHUB_REF_NAME"; fi
          if [ -z "$tag" ] || [ "$tag" = "main" ]; then
            echo "::error::a release tag is required (workflow_dispatch input: tag)"
            exit 1
          fi
          version="$tag"
          if [[ "$tag" == *-v* ]]; then
            version="${tag##*-v}"
          else
            version="${tag#v}"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            if [[ "$version" != *-* ]]; then
              gh release edit "$tag" --prerelease=false
            fi
          elif [[ "$version" == *-* ]]; then
            gh release create "$tag" dist/* --title "$tag" --generate-notes --prerelease
          else
            gh release create "$tag" dist/* --title "$tag" --generate-notes
          fi

      - name: Update plugin list
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout -B main origin/main
          python3 .github/scripts/update_plugin_list.py docs/plugins.md
          if git diff --quiet -- docs/plugins.md; then
            echo "docs/plugins.md is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/plugins.md
          git commit -m "docs: update plugin list"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::failed to push docs/plugins.md"
          exit 1

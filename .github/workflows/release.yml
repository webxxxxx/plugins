name: release

# 发布规则：
#   v<version>              -> 项目 plugin-tools + plugins/ 下全部插件
#   <plugin>-v<version>     -> 只发布该插件（版本必须与插件 manifest 一致）
# PR 只构建校验，不发布；workflow_dispatch 可手动选择 all 或单个插件。

on:
  push:
    tags: ["v*", "*-v*"]
  pull_request:
    paths:
      - "plugins/**"
      - "tools/cli/**"
      - "sdk/**"
      - "templates/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0 or hysteria-v1.0.1 (required when release=true)"
        required: false
      plugin:
        description: "all, or one plugin directory name (hysteria / meow / sshd)"
        required: false
        default: "all"
      release:
        description: "Create or update a GitHub Release"
        type: boolean
        default: false
      build_macos:
        description: "Build macOS too? true/false; empty = the BUILD_MACOS repository variable"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
      filter: ${{ steps.scope.outputs.filter }}
      has_plugins: ${{ steps.matrix.outputs.has_plugins }}
      macos: ${{ steps.targets.outputs.macos }}
      hosts: ${{ steps.targets.outputs.hosts }}
      tools: ${{ steps.targets.outputs.tools }}
    steps:
      - uses: actions/checkout@v7
      - id: scope
        name: Determine release scope
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_PLUGIN: ${{ github.event.inputs.plugin }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then tag="$GITHUB_REF_NAME"; fi
          requested="${INPUT_PLUGIN:-all}"
          filter=""
          case "$tag" in
            *-v*) filter="${tag%%-v*}" ;;
          esac
          if [ -n "$requested" ] && [ "$requested" != "all" ]; then filter="$requested"; fi
          if [ -z "$filter" ]; then filter=all; fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            filter=changed
          fi

          if [ "${{ github.event.inputs.release }}" = "true" ] && [ -z "${{ github.event.inputs.tag }}" ]; then
            echo "::error::workflow_dispatch release requires a tag input"
            exit 1
          fi

          if [ "$filter" != "all" ] && [ "$filter" != "changed" ]; then
            if [ ! -f "plugins/$filter/.plugin.json" ]; then
              echo "::error::unknown plugin '$filter' (no plugins/$filter/.plugin.json)"
              exit 1
            fi
            is_release=false
            if [ "$GITHUB_REF_TYPE" = "tag" ] || [ "${{ github.event.inputs.release }}" = "true" ]; then
              is_release=true
            fi
            if [ "$is_release" = true ]; then
              case "$tag" in
                "$filter"-v*) ;;
                *)
                  echo "::error::per-plugin release tag must look like $filter-v<version>, got $tag"
                  exit 1
                  ;;
              esac
              version="${tag#"$filter"-v}"
              base="${version%%-*}"
              manifest_version=$(jq -r '.version // empty' "plugins/$filter/package/manifest.json")
              if [ -z "$manifest_version" ] || [ "$base" != "$manifest_version" ]; then
                echo "::error::tag version $base does not match plugins/$filter/package/manifest.json version $manifest_version"
                exit 1
              fi
            fi
          fi

          echo "filter=$filter" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - id: version
        name: Read plugin-tools version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' tools/cli/Cargo.toml | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::could not read the version from tools/cli/Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: targets
        name: Decide which runners this release needs
        shell: bash
        env:
          # 仓库变量（Settings -> Secrets and variables -> Actions -> Variables）：
          # 不设或设成 true 就照旧构建 macOS，设成 false/0/no/off 跳过。
          # workflow_dispatch 上的同名输入可以临时覆盖它。
          BUILD_MACOS: ${{ vars.BUILD_MACOS }}
          INPUT_BUILD_MACOS: ${{ github.event.inputs.build_macos }}
        run: |
          set -euo pipefail
          flag="${INPUT_BUILD_MACOS:-${BUILD_MACOS:-}}"
          macos=true
          case "$(printf '%s' "$flag" | tr '[:upper:]' '[:lower:]')" in
            false | 0 | no | off) macos=false ;;
          esac

          hosts='["ubuntu-24.04","windows-2025"]'
          tools='{"include":[{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","kind":"linux"},{"os":"windows-2025","target":"x86_64-pc-windows-msvc","kind":"windows"}]}'
          if [ "$macos" = true ]; then
            hosts='["ubuntu-24.04","macos-15","windows-2025"]'
            tools='{"include":[{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","kind":"linux"},{"os":"windows-2025","target":"x86_64-pc-windows-msvc","kind":"windows"},{"os":"macos-15","target":"universal2-apple-darwin","kind":"macos"}]}'
          else
            echo "::notice::BUILD_MACOS=$flag — 这次不跑 macos-15 runner，也不产出 *-apple-darwin 包"
          fi

          echo "macos=$macos" >> "$GITHUB_OUTPUT"
          echo "hosts=$hosts" >> "$GITHUB_OUTPUT"
          echo "tools=$tools" >> "$GITHUB_OUTPUT"

      - id: matrix
        name: Build the plugin/platform matrix
        shell: bash
        env:
          FILTER: ${{ steps.scope.outputs.filter }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MACOS: ${{ steps.targets.outputs.macos }}
        run: |
          set -euo pipefail
          changed=""
          build_all=false
          if [ "$FILTER" = "changed" ]; then
            if [ -z "$PR_NUMBER" ]; then
              echo "::error::changed scope requires a pull_request event"
              exit 1
            fi
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')
            # A build-tool/SDK change can affect every plugin; fall back to the full matrix.
            if printf '%s\n' "$files" | grep -qE '^(sdk|templates|tools/cli)/'; then
              build_all=true
            fi
            changed=$(printf '%s\n' "$files" | sed -n 's#^plugins/\([^/]*\)/.*#\1#p' | sort -u | tr '\n' ' ')
          fi

          entries='[]'
          for dir in plugins/*/; do
            plugin_dir="${dir%/}"
            plugin_name="${plugin_dir#plugins/}"
            include=false
            if [ "$FILTER" = "all" ] || [ "$build_all" = true ]; then
              include=true
            elif [ "$FILTER" = "changed" ]; then
              case " $changed " in *" $plugin_name "*) include=true ;; esac
            elif [ "$plugin_dir" = "plugins/$FILTER" ]; then
              include=true
            fi
            [ "$include" = true ] || continue

            manifest="${dir}.plugin.json"
            [ -f "$manifest" ] || continue
            name=$(jq -r '.name // empty' "$manifest")
            [ -n "$name" ] || continue
            platforms=$(jq -r '(.ci.platforms // .platforms // [])[]' "$manifest")
            for platform in $platforms; do
              case "$platform" in
                *-apple-darwin) os=macos-15 ;;
                *-windows-*)     os=windows-2025 ;;
                *)               os=ubuntu-24.04 ;;
              esac
              if [ "$os" = macos-15 ] && [ "$MACOS" != true ]; then
                continue
              fi
              entries=$(jq -c \
                --arg plugin "$name" \
                --arg dir "$plugin_dir" \
                --arg platform "$platform" \
                --arg os "$os" \
                '. + [{plugin: $plugin, dir: $dir, platform: $platform, os: $os}]' \
                <<<"$entries")
            done
          done
          if [ "$entries" = "[]" ]; then
            if [ "$FILTER" = "changed" ]; then
              echo "has_plugins=false" >> "$GITHUB_OUTPUT"
              echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
              echo "no changed plugins; skipping the plugin matrix"
              exit 0
            fi
            echo "::error::no plugins with a .plugin.json were found"
            exit 1
          fi
          echo "has_plugins=true" >> "$GITHUB_OUTPUT"
          echo "matrix={\"include\":$entries}" >> "$GITHUB_OUTPUT"

  host:
    name: host tools / ${{ matrix.os }}
    needs: preflight
    if: needs.preflight.outputs.has_plugins == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.preflight.outputs.hosts) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/cli -> target
          key: host-tools-${{ matrix.os }}
      - name: Build plugin-tools and the host CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path tools/cli/Cargo.toml
          cargo install --locked --git https://github.com/webxxxxx/plugin-manager --bin svcd --root "$RUNNER_TEMP/host"
          mkdir -p bin
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp tools/cli/target/release/plugin-tools.exe bin/plugin-tools.exe
            cp "$RUNNER_TEMP/host/bin/svcd.exe" bin/plugin.exe
            chmod +x bin/plugin.exe bin/plugin-tools.exe
          else
            cp tools/cli/target/release/plugin-tools bin/plugin-tools
            cp "$RUNNER_TEMP/host/bin/svcd" bin/plugin
            chmod +x bin/plugin bin/plugin-tools
          fi
          ls -l bin
      - uses: actions/upload-artifact@v7
        with:
          name: host-${{ matrix.os }}
          path: bin/
          if-no-files-found: error
          retention-days: 7

  project:
    name: plugin-tools / ${{ matrix.target }}
    needs: preflight
    if: needs.preflight.outputs.filter == 'all'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.tools) }}
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Add macOS targets
        if: matrix.kind == 'macos'
        shell: bash
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/cli -> target
          key: project-${{ matrix.target }}
      - name: Build (Linux)
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path tools/cli/Cargo.toml
          mkdir -p dist/stage
          cp tools/cli/target/release/plugin-tools dist/stage/
          cp README.md LICENSE dist/stage/
          tar -C dist/stage -czf "dist/plugin-tools-${VERSION}-${TARGET}.tar.gz" .
          rm -rf dist/stage
      - name: Build (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          cargo build --locked --release --target ${{ matrix.target }} --manifest-path tools/cli/Cargo.toml
          New-Item -ItemType Directory -Force dist/stage | Out-Null
          Copy-Item "tools/cli/target/${{ matrix.target }}/release/plugin-tools.exe" dist/stage/
          Copy-Item README.md, LICENSE dist/stage/
          Compress-Archive -Path "dist/stage/*" -DestinationPath "dist/plugin-tools-${env:VERSION}-${env:TARGET}.zip"
          Remove-Item -Recurse -Force dist/stage
      - name: Build (macOS universal)
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path tools/cli/Cargo.toml --target aarch64-apple-darwin
          cargo build --locked --release --manifest-path tools/cli/Cargo.toml --target x86_64-apple-darwin
          mkdir -p dist/stage
          lipo -create \
            tools/cli/target/aarch64-apple-darwin/release/plugin-tools \
            tools/cli/target/x86_64-apple-darwin/release/plugin-tools \
            -output dist/stage/plugin-tools
          chmod 755 dist/stage/plugin-tools
          lipo -info dist/stage/plugin-tools
          cp README.md LICENSE dist/stage/
          tar -C dist/stage -czf "dist/plugin-tools-${VERSION}-${TARGET}.tar.gz" .
          rm -rf dist/stage
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-tools-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  plugins:
    name: ${{ matrix.plugin }} / ${{ matrix.platform }}
    needs: [preflight, host]
    if: needs.preflight.outputs.has_plugins == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: host-${{ matrix.os }}
          path: bin
      - name: Add host tools to PATH
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            chmod +x bin/plugin.exe bin/plugin-tools.exe
            echo "SVCD_PLUGIN_BIN=$GITHUB_WORKSPACE/bin/plugin.exe" >> "$GITHUB_ENV"
          else
            chmod +x bin/plugin bin/plugin-tools
            echo "SVCD_PLUGIN_BIN=$GITHUB_WORKSPACE/bin/plugin" >> "$GITHUB_ENV"
          fi
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
      - name: Install Rust (meow/plugin-store)
        if: matrix.plugin == 'meow' || matrix.plugin == 'plugin-store'
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.platform }}
      - name: Install Go (hysteria only)
        if: matrix.plugin == 'hysteria'
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang libssl-dev pkg-config make perl curl xz-utils
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: brew install cmake
      - name: Install the musl cross toolchain
        if: runner.os == 'Linux' && contains(matrix.platform, 'musl')
        shell: bash
        # 与样例、模板共用 tools/cross/install.sh：musl.cc 的包 + 镜像回退，
        # 变量按平台写进 $GITHUB_ENV / $GITHUB_PATH（含 CROSS_PREFIX）。
        run: sh tools/cross/install.sh "${{ matrix.platform }}"
      - name: Build unsigned .spk
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ matrix.dir }}"
          # --stage 让带 platforms/ 的插件把「合并后的清单 + payload」落到
          # dist/stage/package：签名 job 会重新 bundle 这个目录，所以平台清单
          # 必须在这里就进包，而不是等到签名时。
          plugin-tools build --platform "${{ matrix.platform }}" --stage dist/stage
      - name: Package the unsigned payload
        shell: bash
        run: |
          set -euo pipefail
          # 打的是 stage，不是 package/：前者带着本平台的清单。
          tar -C "${{ matrix.dir }}/dist/stage" -czf pkg.tgz package
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.plugin }}-${{ matrix.platform }}
          path: pkg.tgz
          if-no-files-found: error
          retention-days: 7

  sign:
    name: sign release
    needs: [preflight, host, plugins]
    if: |
      !cancelled()
      && needs.preflight.outputs.has_plugins == 'true'
      && needs.plugins.result == 'success'
      && (startsWith(github.ref, 'refs/tags/') || github.event.inputs.release == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # 建议在仓库 Settings -> Environments 里给 release 配 required reviewers。
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: host-ubuntu-24.04
          path: bin
      - uses: actions/download-artifact@v5
        with:
          path: pkgs
          pattern: pkg-*
      - name: Sign and verify .spk
        env:
          # 只有这个 job 的这一步能看到发布钥；上面的构建 job 完全没有。
          PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PLUGIN_SIGNING_KEY:-}" ]; then
            echo "::error::PLUGIN_SIGNING_KEY is required for a release build"
            exit 1
          fi
          chmod +x bin/plugin
          umask 077
          printf '%s' "$PLUGIN_SIGNING_KEY" > "$RUNNER_TEMP/signing.pem"
          trap 'rm -f "$RUNNER_TEMP/signing.pem" "$RUNNER_TEMP/signing.pub"' EXIT
          openssl pkey -in "$RUNNER_TEMP/signing.pem" -pubout -out "$RUNNER_TEMP/signing.pub"
          mkdir -p dist
          signed=0
          for archive in pkgs/*/pkg.tgz; do
            [ -f "$archive" ] || continue
            dir=$(basename "$(dirname "$archive")")
            tmp=$(mktemp -d)
            tar -xzf "$archive" -C "$tmp"
            manifest="$tmp/package/manifest.json"
            # `id` is the identity and names the artifact; `name` is the display
            # name (any UTF-8) and must never reach a file name.
            id=$(jq -r '.id // empty' "$manifest")
            version=$(jq -r '.version // empty' "$manifest")
            exec_path=$(jq -r '.exec.path // empty' "$manifest")
            platform="${dir#pkg-$id-}"
            if [ -z "$id" ] || [ -z "$version" ] || [ "$platform" = "$dir" ] || [ -z "$platform" ]; then
              echo "::error::bad package artifact $dir (id=$id version=$version platform=$platform)"
              exit 1
            fi
            if [ -z "$exec_path" ]; then
              echo "::error::manifest has no exec.path in $dir"
              exit 1
            fi
            if [ ! -f "$tmp/package/$exec_path" ]; then
              if [ -f "$tmp/package/$exec_path.exe" ]; then
                exec_path="$exec_path.exe"
              else
                echo "::error::exec.path not found in $dir: $exec_path"
                exit 1
              fi
            fi
            out="dist/${id}-${version}-${platform}.spk"
            bin/plugin bundle "$tmp/package" --platform "$platform" --id "$id" --exec "$exec_path" --key "$RUNNER_TEMP/signing.pem" -o "$out"
            bin/plugin verify "$out" --pubkey "$RUNNER_TEMP/signing.pub"
            rm -rf "$tmp"
            signed=$((signed + 1))
          done
          if [ "$signed" -lt 1 ]; then
            echo "::error::no packages were signed"
            exit 1
          fi
          ls -lh dist
      - uses: actions/upload-artifact@v7
        with:
          name: spk-signed
          path: dist/*.spk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    needs: [preflight, sign, project]
    if: |
      !cancelled()
      && needs.preflight.result == 'success'
      && needs.sign.result == 'success'
      && (needs.project.result == 'success' || needs.project.result == 'skipped')
      && (startsWith(github.ref, 'refs/tags/') || github.event.inputs.release == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: spk-*
          merge-multiple: true
      - uses: actions/download-artifact@v5
        if: needs.project.result == 'success'
        with:
          path: dist
          pattern: plugin-tools-*
          merge-multiple: true
      - name: Add the release public key
        shell: bash
        run: |
          # keyId comes from the file stem; packages are signed with
          # signing.pem, so new downloads must expose signing.pub.
          if [ -f docs/signing.pub ]; then
            cp docs/signing.pub dist/
          fi
          # Keep the old asset name for links in already-published releases.
          if [ -f docs/release-key.pub ]; then
            cp docs/release-key.pub dist/
          fi
      - name: Verify the artifact set
        shell: bash
        env:
          FILTER: ${{ needs.preflight.outputs.filter }}
        run: |
          set -euo pipefail
          ls -lh dist
          spk=$(find dist -maxdepth 1 -type f -name '*.spk' | wc -l | tr -d ' ')
          tool=$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d ' ')
          if [ "$spk" -lt 1 ]; then
            echo "::error::no plugin .spk was produced (spk=$spk)"
            exit 1
          fi
          if [ "$FILTER" = "all" ] && [ "$tool" -lt 1 ]; then
            echo "::error::expected plugin-tools archives for a full release (tool=$tool)"
            exit 1
          fi
      - name: Write SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f \( -name '*.spk' -o -name '*.tar.gz' -o -name '*.zip' -o -name '*.pub' \) -printf '%f\n' \
            | sort | xargs -r sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG"
          if [ -z "$tag" ]; then tag="$GITHUB_REF_NAME"; fi
          if [ -z "$tag" ] || [ "$tag" = "main" ]; then
            echo "::error::a release tag is required (workflow_dispatch input: tag)"
            exit 1
          fi
          version="$tag"
          if [[ "$tag" == *-v* ]]; then
            version="${tag##*-v}"
          else
            version="${tag#v}"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            if [[ "$version" != *-* ]]; then
              gh release edit "$tag" --prerelease=false
            fi
          elif [[ "$version" == *-* ]]; then
            gh release create "$tag" dist/* --title "$tag" --generate-notes --prerelease
          else
            gh release create "$tag" dist/* --title "$tag" --generate-notes
          fi

      - name: Update plugin list
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout -B main origin/main
          python3 .github/scripts/update_plugin_list.py docs/plugins.md
          if git diff --quiet -- docs/plugins.md; then
            echo "docs/plugins.md is up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/plugins.md
            git commit -m "docs: update plugin list"
            pushed=0
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                pushed=1
                break
              fi
              sleep 3
            done
            if [ "$pushed" != 1 ]; then
              echo "::error::failed to push docs/plugins.md"
              exit 1
            fi
          fi
          # The store's mirror is jsDelivr, whose branch URLs are cached for a
          # week (max-age=604800). Purge it after every rewrite so a plugin
          # released today is not listed as last week's version there.
          if curl -fsS --max-time 60 \
              "https://purge.jsdelivr.net/gh/webxxxxx/plugins@main/docs/plugins.md" >/dev/null; then
            echo "purged the jsDelivr cache for docs/plugins.md"
          else
            echo "::warning::jsDelivr purge failed; the mirror may serve a stale catalog until it expires"
          fi

  # The mirror is a convenience, not the source of truth: the GitHub release is
  # already published at this point, so a mirror that cannot be reached must
  # not pretend the release failed. It still fails loudly when it talks to
  # Qiniu and Qiniu refuses.
  qiniu:
    name: mirror to qiniu
    needs: [publish, project]
    if: |
      !cancelled()
      && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Both this job and the scheduled `mirror` workflow rewrite the bucket root,
    # and index.json is read-modify-write: serialize them.
    concurrency:
      group: qiniu-mirror
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: spk-*
          merge-multiple: true
      - uses: actions/download-artifact@v5
        if: needs.project.result == 'success'
        with:
          path: dist
          pattern: plugin-tools-*
          merge-multiple: true
      - name: Add the release public key
        shell: bash
        run: |
          set -euo pipefail
          # The root of the bucket is the install surface, so the key that
          # verifies every package there has to live next to them.
          for name in signing.pub release-key.pub; do
            if [ -f "docs/$name" ]; then cp "docs/$name" dist/; fi
          done
          ls -1 dist
      - name: Fetch the daemon release to mirror
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # svcd is built in another repository. The mirror still has to carry
          # it, so its newest stable archives are pulled next to the packages
          # and the sync script places them at the root.
          repo="webxxxxx/plugin-manager"
          # `release view` returns the newest release even when it is a
          # prerelease; list with the prereleases excluded instead, so an rc
          # never replaces the stable daemon on the mirror.
          tag=$(gh release list --repo "$repo" --exclude-pre-releases --limit 1 \
                  --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          if [ -z "$tag" ]; then
            echo "::warning::no stable release in $repo; the index keeps the svcd entries the bucket already has"
            exit 0
          fi
          mkdir -p svcd
          if ! gh release download "$tag" --repo "$repo" --pattern 'svcd-*' --dir svcd --clobber; then
            echo "::warning::$repo $tag has no svcd archives to mirror"
            exit 0
          fi
          cp svcd/* dist/
          echo "mirroring svcd $tag"
          ls -1 svcd
      - name: Install the Qiniu SDK
        run: |
          set -euo pipefail
          # Ubuntu 24.04 refuses `pip install` outside a venv (PEP 668), and a
          # venv also keeps the release job from touching the system Python.
          python3 -m venv "$RUNNER_TEMP/qiniu"
          "$RUNNER_TEMP/qiniu/bin/pip" install --disable-pip-version-check --quiet qiniu==7.18.0
      - name: Sync the root and the history
        shell: bash
        env:
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
          QINIU_DOMAIN: ${{ secrets.QINIU_DOMAIN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${QINIU_ACCESS_KEY:-}" ] || [ -z "${QINIU_SECRET_KEY:-}" ]; then
            echo "::notice::QINIU_ACCESS_KEY / QINIU_SECRET_KEY are not configured; the mirror is skipped"
            exit 0
          fi
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [ -z "$tag" ] || [ "$tag" = "main" ]; then
            echo "::error::a release tag is required to place the history folder"
            exit 1
          fi
          "$RUNNER_TEMP/qiniu/bin/python" .github/scripts/sync_qiniu.py --dir dist --tag "$tag"

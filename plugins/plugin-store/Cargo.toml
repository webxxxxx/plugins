[package]
name = "plugin-store"
version = "0.1.18"
edition = "2021"
publish = false

[dependencies]
serde_json = "1"
svcd-plugin = { path = "../../sdk/rust" }
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

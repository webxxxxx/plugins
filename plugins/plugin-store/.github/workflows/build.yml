name: build

# 这个文件属于插件项目本身：插件独立成仓库后，它就是该插件的 CI。
# 平台列表来自 .plugin.json；没写 platforms 的插件视为 7 个平台通用，全部构建。

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platforms:
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        name: Read the declared platforms
        run: |
          set -euo pipefail
          list=$(jq -c '.ci.platforms // .platforms // []' .plugin.json 2>/dev/null || echo '[]')
          if [ -z "$list" ] || [ "$list" = "[]" ]; then
            list='["x86_64-unknown-linux-musl","aarch64-unknown-linux-musl","armv7-unknown-linux-musleabihf","x86_64-unknown-linux-gnu","x86_64-pc-windows-msvc","aarch64-apple-darwin","x86_64-apple-darwin"]'
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"

  build:
    name: build / ${{ matrix.platform }}
    needs: platforms
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.platforms.outputs.list) }}
    runs-on: ${{ contains(matrix.platform, 'windows') && 'windows-2025' || contains(matrix.platform, 'darwin') && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform }}
      - name: Install musl cross toolchains
        if: runner.os == 'Linux' && (matrix.platform == 'aarch64-unknown-linux-musl' || matrix.platform == 'armv7-unknown-linux-musleabihf' || matrix.platform == 'x86_64-unknown-linux-musl')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cross"
          case "${{ matrix.platform }}" in
            aarch64-unknown-linux-musl)
              dir=aarch64-linux-musl-cross
              cc=aarch64-linux-musl-gcc
              cargo_key=AARCH64_UNKNOWN_LINUX_MUSL
              cc_key=aarch64_unknown_linux_musl
              ;;
            armv7-unknown-linux-musleabihf)
              dir=arm-linux-musleabihf-cross
              cc=arm-linux-musleabihf-gcc
              cargo_key=ARMV7_UNKNOWN_LINUX_MUSLEABIHF
              cc_key=armv7_unknown_linux_musleabihf
              ;;
            x86_64-unknown-linux-musl)
              dir=x86_64-linux-musl-cross
              cc=x86_64-linux-musl-gcc
              cargo_key=X86_64_UNKNOWN_LINUX_MUSL
              cc_key=x86_64_unknown_linux_musl
              ;;
          esac
          tgz="$RUNNER_TEMP/$dir.tgz"
          ok=0
          for base in \
            https://github.com/musl-cc/musl.cc/releases/download/v0.0.1 \
            https://github.com/tsl0922/musl-toolchains/releases/download/2021-11-23 \
            https://musl.cc; do
            if curl -fL --connect-timeout 10 --max-time 300 --retry 2 --retry-delay 3 -o "$tgz" "$base/$dir.tgz" \
              && tar tzf "$tgz" >/dev/null 2>&1; then
              ok=1
              break
            fi
            rm -f "$tgz"
          done
          if [ "$ok" != 1 ]; then
            echo "::error::could not download $dir.tgz"
            exit 1
          fi
          tar xzf "$tgz" -C "$RUNNER_TEMP/cross"
          rm -f "$tgz"
          prefix="$RUNNER_TEMP/cross/$dir"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_${cargo_key}_LINKER=$prefix/bin/$cc" >> "$GITHUB_ENV"
          echo "CC_${cc_key}=$prefix/bin/$cc" >> "$GITHUB_ENV"
          echo "CXX_${cc_key}=$prefix/bin/${cc%gcc}g++" >> "$GITHUB_ENV"
          echo "AR_${cc_key}=$prefix/bin/${cc%gcc}ar" >> "$GITHUB_ENV"
          echo "RANLIB_${cc_key}=$prefix/bin/${cc%gcc}ranlib" >> "$GITHUB_ENV"

      - name: Install plugin-tools
        shell: bash
        run: |
          set -euo pipefail
          # The crate lives in tools/cli; cargo install --git does not look in subdirectories.
          git clone --depth 1 https://github.com/webxxxxx/plugins "$RUNNER_TEMP/plugins"
          cargo install --locked --path "$RUNNER_TEMP/plugins/tools/cli"
      - name: Install the host plugin CLI
        shell: bash
        # plugin-tools 只编排，真正打包的是宿主的 `plugin bundle`。
        run: |
          set -euo pipefail
          cargo install --locked --git https://github.com/webxxxxx/plugin-manager --bin svcd
          mkdir -p "$HOME/.local/bin"
          # Windows 只按 plugin.exe 查找；复制成没有扩展名的 plugin 不会被执行。
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$(command -v svcd.exe || command -v svcd)" "$HOME/.local/bin/plugin.exe"
          else
            cp "$(command -v svcd)" "$HOME/.local/bin/plugin"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build and verify
        run: plugin-tools build --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: spk-${{ matrix.platform }}
          path: dist/*.spk
          if-no-files-found: error
          retention-days: 7
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="300" height="300">
  <defs>
    <!-- 1. 背景的径向渐变 -->
    <radialGradient id="bgGrad" cx="40%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#00A5FF"/>
      <stop offset="60%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#0033CC"/>
    </radialGradient>

    <!-- 2. 购物袋主体的微弱光泽渐变 -->
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F6FF"/>
    </linearGradient>

    <!-- 3. 购物袋的柔和投影 -->
    <filter id="bagShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#002299" flood-opacity="0.5" />
    </filter>
    
    <!-- 4. 文字/提手内阴影滤镜 -->
    <filter id="innerShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur"/>
      <feOffset dx="0" dy="2" result="offsetBlur"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
      <feFlood flood-color="#002299" flood-opacity="0.4"/>
      <feComposite in2="shadowDiff" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- ==================== 1. 背景 ==================== -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#bgGrad)" />
  <rect x="4" y="4" width="92" height="92" rx="22" fill="none" stroke="#64D2FF" stroke-width="1" opacity="0.4" />

  <!-- ==================== 2. 购物袋 ==================== -->
  <g filter="url(#bagShadow)">
    <!-- 袋子主体 (纯白渐变，无浅蓝反光) -->
    <path d="M 22 34 Q 20 34 20 36 L 15 72 Q 15 80 24 80 L 76 80 Q 85 80 85 72 L 80 36 Q 80 34 78 34 Z" fill="url(#bagGrad)" />
  </g>

  <!-- ==================== 3. 提手 ==================== -->
  <path d="M 36 34 L 36 26 A 14 14 0 0 1 64 26 L 64 34" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
  <!-- 提手内轮廓深蓝色 -->
  <path d="M 36 34 L 36 26 A 14 14 0 0 1 64 26 L 64 34" fill="none" stroke="#004FEB" stroke-width="2.5" stroke-linecap="round" opacity="0.7" filter="url(#innerShadow)"/>
  <!-- 提手与袋子的交界处阴影 -->
  <path d="M 31 34 L 41 34 M 59 34 L 69 34" fill="none" stroke="#B0D4FF" stroke-width="2" stroke-linecap="round" />


  <!-- ==================== 4. 文字 "spk" ==================== -->
  <text x="50" y="65" text-anchor="middle" font-family="'Arial Rounded MT Bold', 'Nunito', 'Segoe UI', sans-serif" font-weight="900" font-size="32" fill="#004FEB" letter-spacing="-1" filter="url(#textShadow)">
    spk
  </text>

  <text x="50" y="65" text-anchor="middle" font-family="'Arial Rounded MT Bold', 'Nunito', 'Segoe UI', sans-serif" font-weight="900" font-size="32" fill="#FFFFFF" opacity="0.1" letter-spacing="-1">
    spk
  </text>

</svg>

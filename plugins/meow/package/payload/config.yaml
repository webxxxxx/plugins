port: null
socks-port: null
mixed-port: 7890
allow-lan: true
bind-address: 0.0.0.0
mode: rule
log-level: warning
ipv6: true
external-controller: '[::]:9090'
external-ui: yacd
external-ui-name: null
external-ui-url: null
secret: 123456
dns:
  enable: true
  listen: "[::]:5353"
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: null
  store-fake-ip: null
  default-nameserver: null
  nameserver:
  - 223.5.5.5
  - 119.29.29.29
  proxy-server-nameserver: null
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "webx.xin"
    - "*.webx.xin"
  use-system-hosts: null
  use-hosts: null
  nameserver-policy:
    "geosite:cn": [223.5.5.5, 119.29.29.29]
    "geosite:geolocation-!cn": [https://dns.google/dns-query, https://1.1.1.1/dns-query]
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
    domain:
      - '+.google.com'
      - '+.youtube.com'
      - '+.chatgpt.com'
      - '+.x.com'
    fallback:
      - https://dns.google/dns-query
      - https://1.1.1.1/dns-query
      - tls://8.8.8.8:853
rule-providers:
  cn_domains:
    type: file
    behavior: domain
    format: null
    url: null
    path: cn_domains.yaml
    interval: null
    proxy: null
    payload: null
sub-rules:
  cn-direct:
  - RULE-SET,cn_domains,DIRECT
  - DOMAIN-SUFFIX,DIRECT
strict: null
tproxy-port: null
tproxy-sni: true
routing-mark: 9527
tcp-connect-timeout: null
sniffer: null
listeners:
- name: tproxy-tcp
  type: tproxy
  port: 7895
  listen: "0.0.0.0"
  tproxy-sni: null
  firewall: false
  udp-timeout: null
  max-connections: null
  cipher: null
  password: null
  udp: null
  simple-obfs: null
  shadow-tls: null
  res-tls: null
  jls-config: null
  kcp-tun: null
  mux-option: null
authentication: null
skip-auth-prefixes: null
geodata: null
tun: null
max-connections: null
firewall: false
udp: null
udp-timeout: null

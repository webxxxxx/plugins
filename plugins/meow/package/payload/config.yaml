port: null
socks-port: null
mixed-port: null                                   # 网关不需要 LAN 侧 HTTP/SOCKS；要开请配 authentication
allow-lan: true
bind-address: 0.0.0.0
mode: rule
log-level: warning
ipv6: false                                        # 规则只有 v4 REDIRECT；true 会返回 AAAA 导致绕过
external-controller: '0.0.0.0:9090'
external-ui: yacd
external-ui-name: null
external-ui-url: null
secret: ''
dns:
  enable: true
  listen: "0.0.0.0:1053"                            # 必须配 meow-fw.sh 的 DNS_PORT
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: null
  store-fake-ip: null
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29                              # 用来解析 fallback 里的 https://dns.google 这类域名
  nameserver:
  - 223.5.5.5
  - 119.29.29.29
  proxy-server-nameserver: null
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "webx.xin"
    - "*.webx.xin"
  use-system-hosts: null
  use-hosts: null
  nameserver-policy:
    "rule-set:cn_domains": [223.5.5.5, 119.29.29.29]   # 用本地的 cn_domains 规则集，不依赖 geosite.dat
  fallback-filter: 
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
    domain:
      - '+.google.com'
      - '+.youtube.com'
      - '+.chatgpt.com'
      - '+.x.com'
  fallback:
    - https://dns.google/dns-query
    - https://1.1.1.1/dns-query
    - tls://8.8.8.8:853
rule-providers:
  cn_domains:
    type: file
    # 包里那份表是古典写法（DOMAIN-SUFFIX,… / DOMAIN,…）。写成 domain 会把每条当成一个
    # 字面域名塞进 trie，规则集静默变空；换成纯域名表之后这里要跟着改回 domain。
    behavior: classical
    format: null
    url: null
    path: '@DATA@/cn_domains.yaml'
    interval: null
    proxy: null
    payload: null
sub-rules:
  cn-direct:
  - RULE-SET,cn_domains,DIRECT
strict: null
tproxy-port: null
# tproxy-sni 已废弃，改用上面的 sniffer
routing-mark: 9527
tcp-connect-timeout: null
sniffer:
  enable: true
  override-destination: false
  sniff:
    TLS: { ports: [443] }
    HTTP: { ports: [80] }
listeners:
- name: tproxy-tcp
  type: tproxy
  port: 7893                                     # 与 sr.conf 的 MEOW_TPROXY_PORT 一致
  listen: "0.0.0.0"
  firewall: false
  max-connections: 4096                       # 默认 256 会被几个家庭设备打满
  cipher: null
  password: null
  udp: null
  simple-obfs: null
  shadow-tls: null
  res-tls: null
  jls-config: null
  kcp-tun: null
  mux-option: null
authentication: null
skip-auth-prefixes: null
geodata:
  mmdb-path: '@DATA@/Country.mmdb'
  asn-path: '@DATA@/GeoLite2-ASN.mmdb'
  geosite-path: '@DATA@/geosite.dat'

tun: null
max-connections: 4096

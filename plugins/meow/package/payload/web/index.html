<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<title>meow</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // 先把主题定下来，免得闪一下：优先用上一次 YACD 报过来的主题（存在这一页自己的
  // localStorage 里），没有就看系统偏好；之后由 iframe 里的 theme-bridge.js 持续同步。
  (function () {
    var theme = null;
    try { theme = localStorage.getItem('meow.theme'); } catch (e) {}
    if (theme !== 'dark' && theme !== 'light') {
      theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<style>
  :root {
    color-scheme: light;
    /* 订阅管理弹层的配色：外壳跟 /ui/sub.html 用同一套颜色，两边一起换。 */
    --subs-bg: #ffffff; --subs-fg: #1f2328; --subs-line: #dcdfe4;
    --subs-hover: #eef1f4; --subs-muted: #57606a;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --subs-bg: #1a1a1a; --subs-fg: #eaeaea; --subs-line: #303030;
    --subs-hover: #2a2a2a; --subs-muted: #9aa0a6;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans SC", sans-serif;
    background: #f6f7f9; color: #1f2328;
  }
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 9px 14px; background: #fff; border-bottom: 1px solid #dcdfe4;
  }
  h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  label { display: inline-flex; align-items: center; gap: 6px; }
  select {
    font: inherit; padding: 3px 8px; border-radius: 6px;
    border: 1px solid #c9ced6; background: #fff; color: inherit;
  }
  select:disabled { opacity: .55; }
  #status { color: #57606a; }
  #status.up { color: #1a7f37; }
  #status.down { color: #9a6700; }
  #status.bad { color: #cf222e; }
  #subs-open {
    margin-left: auto; font: inherit; padding: 4px 12px; border-radius: 6px;
    border: 1px solid #c9ced6; background: #fff; color: inherit; cursor: pointer;
  }
  #subs-open:hover { background: #eef1f4; }
  #subs-open:disabled { opacity: .55; cursor: default; }
  main { position: relative; flex: 1; min-height: 0; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  #overlay {
    position: absolute; inset: 0; display: none; place-items: center;
    padding: 24px; text-align: center; color: #57606a;
  }
  main.down #overlay { display: grid; }
  main.down iframe { visibility: hidden; }

  /* 订阅管理：顶部按钮打开弹层，内容是 meow 自己那份 /ui/sub.html。
     YACD 里不再注入浮动按钮（那套做法已经去掉）。外壳和订阅页都跟着主题走：
     深色、浅色各一套颜色变量，打开时用 ?theme= 把当前主题告诉 iframe。 */
  dialog {
    width: min(560px, calc(100vw - 32px));
    height: min(560px, calc(100vh - 48px));
    padding: 0; border: 1px solid var(--subs-line); border-radius: 10px;
    background: var(--subs-bg); color: var(--subs-fg); overflow: hidden;
  }
  dialog[open] { display: flex; flex-direction: column; }
  dialog::backdrop { background: rgba(0, 0, 0, .5); }
  .subs-head {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid var(--subs-line);
  }
  .subs-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
  #subs-close {
    margin-left: auto; border: 0; background: transparent; color: inherit;
    font: inherit; font-size: 20px; line-height: 1; padding: 2px 9px; border-radius: 6px; cursor: pointer;
  }
  #subs-close:hover { background: var(--subs-hover); }
  .subs-body { position: relative; flex: 1; min-height: 0; background: var(--subs-bg); }
  #subs-frame { background: var(--subs-bg); }
  .subs-empty {
    position: absolute; inset: 0; display: grid; place-items: center;
    margin: 0; padding: 24px; text-align: center; color: var(--subs-muted);
  }
  /* 深色皮肤：跟着 YACD 的主题走（见下面的 theme-bridge），不看系统偏好。 */
  :root[data-theme="dark"] body { background: #0d1117; color: #e6edf3; }
  :root[data-theme="dark"] header { background: #161b22; border-color: #30363d; }
  :root[data-theme="dark"] select,
  :root[data-theme="dark"] #subs-open { background: #0d1117; border-color: #3d444d; }
  :root[data-theme="dark"] #subs-open:hover { background: #21262d; }
  :root[data-theme="dark"] #status,
  :root[data-theme="dark"] #overlay { color: #9198a1; }
  :root[data-theme="dark"] #ui { background: #0d1117; }
</style>
<body>
  <header>
    <h1>meow</h1>
    <label>代理类型
      <select id="mode" disabled>
        <option value="off">off（不接管）</option>
        <option value="tun">tun（本机 TUN）</option>
        <option value="tproxy">tproxy（网关）</option>
      </select>
    </label>
    <span id="status">读取状态…</span>
    <button id="subs-open" type="button">订阅管理</button>
  </header>
  <main id="panel" class="down">
    <iframe id="ui" title="meow 面板" referrerpolicy="no-referrer"></iframe>
    <div id="overlay"><p id="overlay-text">meow 没在运行，起来之后这里就是它的面板。</p></div>
  </main>

  <dialog id="subs" aria-label="订阅管理">
    <div class="subs-head">
      <h2>订阅管理</h2>
      <button id="subs-close" type="button" aria-label="关闭" title="关闭（Esc）">×</button>
    </div>
    <div class="subs-body">
      <iframe id="subs-frame" title="订阅管理"></iframe>
      <p class="subs-empty" id="subs-empty" hidden>meow 没在运行，起来之后才能管理订阅。</p>
    </div>
  </dialog>

  <script type="module">
    // 这个页面是壳：顶上是代理类型（off / tun / tproxy）和订阅管理，下面 iframe 嵌 meow 自带的 YACD。
    // 选代理类型 → 调插件能力 mode → 写进 state 的 proxy-mode → 看护进程按新形态重启 meow。
    // 刚装好时 state 里没有这个键，插件按 off 走：不接管流量，先选 tun / tproxy 才接管。
    // 订阅管理不用 YACD 里的浮动按钮：顶部按钮弹一个 <dialog>，里面是 meow 自己那份
    // /ui/sub.html（还是同一套 /api/subscriptions 接口）。
    import { pluginUI } from './plugin-ui.mjs';

    const ui = pluginUI();
    const select = document.getElementById('mode');
    const statusEl = document.getElementById('status');
    const panel = document.getElementById('panel');
    const iframe = document.getElementById('ui');
    const overlayText = document.getElementById('overlay-text');
    const subsButton = document.getElementById('subs-open');
    const subsDialog = document.getElementById('subs');
    const subsFrame = document.getElementById('subs-frame');
    const subsEmpty = document.getElementById('subs-empty');

    const NAMES = { off: 'off（不接管）', tun: 'tun（本机 TUN）', tproxy: 'tproxy（网关）' };

    // YACD 由 meow 自己在 external-controller 上提供；用当前浏览器访问的主机名，
    // 兼容 127.0.0.1 / localhost / 局域网地址。订阅页是同一个 controller 上的 /ui/sub.html。
    const raw = location.hostname || '127.0.0.1';
    const host = (raw === '[::1]' || raw === '::1' || raw === '::') ? '127.0.0.1' : raw;
    const PANEL = `http://${host}:9090/ui/`;

    let last = {};

    // 顶部这一栏跟着 YACD 内部切换的主题走。两边不同源，读不到它的 DOM / localStorage，
    // 所以由 meow 那份 yacd/theme-bridge.js 把 <html data-theme> 的变化 postMessage 过来。
    const THEME_KEY = 'meow.theme';

    function applyTheme(theme) {
      const value = theme === 'dark' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', value);
      try {
        localStorage.setItem(THEME_KEY, value);
      } catch {
        // 隐私模式下写不进去，不影响这次切换。
      }
      // 弹层开着就顺手通知订阅页：它自己没法定主题，只能这边告诉它。
      if (subsDialog.open && subsFrame.contentWindow) {
        subsFrame.contentWindow.postMessage({ type: 'meow:theme', theme: value }, '*');
      }
    }

    window.addEventListener('message', (event) => {
      if (event.source !== iframe.contentWindow) return; // 只认 panel 那个 iframe
      const data = event.data;
      if (data && data.type === 'meow:theme') applyTheme(data.theme);
    });

    function say(text, kind = '') {
      statusEl.textContent = text;
      statusEl.className = kind;
    }

    function render(state) {
      last = state || {};
      const allowed = Array.isArray(last.allowed) ? last.allowed : ['off', 'tun', 'tproxy'];
      for (const option of select.options) {
        const ok = allowed.includes(option.value);
        option.disabled = !ok;
        option.textContent = ok ? NAMES[option.value] : `${NAMES[option.value]}（仅 Linux）`;
      }
      if (last.mode) select.value = last.mode;
      select.disabled = false;
      subsButton.disabled = false;

      if (last.running) {
        const port = last['mixed-port'] ? ` · mixed ${last['mixed-port']}` : '';
        say(`运行中${port}`, 'up');
        showPanel(true);
      } else {
        say('meow 未运行', 'down');
        showPanel(false);
      }
    }

    function showPanel(up) {
      panel.classList.toggle('down', !up);
      if (!up) return;
      // secret 跟着 URL 传给 YACD：订阅里带了密钥也不会每次弹登录框。
      // 时间戳强制重载：切形态之后旧面板是断的，同一个 URL 赋值浏览器不一定重新拉。
      const query = new URLSearchParams();
      if (last.secret) query.set('secret', last.secret);
      query.set('t', String(Date.now()));
      iframe.src = `${PANEL}?${query}`;
    }

    // 打开订阅管理：secret 也从这里传（浏览器第一次打开这个页面时 YACD 还没把密钥
    // 存进 localStorage）；t 只为每次打开都重新拉一遍列表。
    function subsURL() {
      const query = new URLSearchParams();
      query.set('embed', '1');
      if (last.secret) query.set('secret', last.secret);
      // 主题用参数给初值：iframe 那边据此先把颜色定下来，不用等消息。
      query.set('theme', document.documentElement.dataset.theme || 'light');
      query.set('t', String(Date.now()));
      return `${PANEL}sub.html?${query}`;
    }

    function openSubs() {
      const up = Boolean(last.running);
      subsEmpty.hidden = up;
      subsFrame.hidden = !up;
      if (up) {
        subsFrame.src = subsURL();
      } else {
        subsFrame.src = 'about:blank';
      }
      if (typeof subsDialog.showModal !== 'function') {
        // 很老的浏览器没有 <dialog>：退化成新窗口，打开的还是同一个页面。
        if (last.running) window.open(subsURL(), '_blank', 'width=600,height=680');
        return;
      }
      subsDialog.showModal();
    }

    subsButton.addEventListener('click', openSubs);
    subsButton.disabled = true; // 读到状态之前先别点：那会儿还不知道 secret
    document.getElementById('subs-close').addEventListener('click', () => subsDialog.close());
    // 点弹层外的遮罩也关：dialog 只在自己接住内容之外的点击。Esc 由 <dialog> 自带。
    subsDialog.addEventListener('click', (event) => {
      if (event.target === subsDialog) subsDialog.close();
    });
    // 关掉之后把 iframe 放回空白，别让隐藏的页面继续拉着那份列表。
    subsDialog.addEventListener('close', () => { subsFrame.src = 'about:blank'; });

    async function read() {
      return JSON.parse(await ui.invoke('mode'));
    }

    async function waitReady() {
      for (let i = 0; i < 30; i += 1) {
        await new Promise((resolve) => setTimeout(resolve, 1000));
        try {
          const state = await read();
          if (state.running) {
            render(state);
            say(`运行中 · ${NAMES[state.mode] || state.mode}`, 'up');
            return;
          }
        } catch {
          // 正在重启，插件进程这一刻可能不回话，继续等。
        }
      }
      say('等 meow 起来超时，稍后刷新页面', 'bad');
    }

    select.addEventListener('change', async () => {
      const wanted = select.value;
      select.disabled = true;
      say(`切到 ${NAMES[wanted] || wanted}…`, 'down');
      try {
        await ui.invoke('mode', { mode: wanted });
      } catch (error) {
        say(`切换失败：${error.message}`, 'bad');
        select.value = last.mode || '';
        select.disabled = false;
        return;
      }
      await waitReady();
    });

    try {
      render(await read());
    } catch (error) {
      select.disabled = true;
      say('插件没在运行', 'bad');
      overlayText.textContent = `连不上插件进程（${error.message}）。先 plugin start meow，再刷新这一页。`;
      panel.classList.add('down');
    }
  </script>
</body>
</html>

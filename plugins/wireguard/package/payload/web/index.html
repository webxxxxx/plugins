<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WireGuard</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f6f8;
    --card: #ffffff;
    --fg: #1f2328;
    --muted: #6b7280;
    --line: #e3e6ea;
    --accent: #2563eb;
    --accent-fg: #ffffff;
    --danger: #dc2626;
    --ok: #16a34a;
    --warn: #b45309;
    --input: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-theme="dark"], :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #111318;
      --card: #1a1d24;
      --fg: #e6e8eb;
      --muted: #9aa1ab;
      --line: #2a2f38;
      --accent: #4f8cff;
      --accent-fg: #0b1220;
      --danger: #f87171;
      --ok: #4ade80;
      --warn: #fbbf24;
      --input: #14171d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.55 system-ui, -apple-system, "Segoe UI", "Noto Sans SC", sans-serif;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; align-items: flex-start; gap: 16px; justify-content: space-between; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .grid { display: grid; gap: 12px; }
  .cards { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .stat .label { font-size: 12px; color: var(--muted); }
  .stat .value { font-size: 15px; margin-top: 3px; word-break: break-all; }
  .pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px; font-size: 12px; border: 1px solid var(--line); background: var(--card); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); }
  .dot.warn { background: var(--warn); }
  .dot.bad { background: var(--danger); }
  .form-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input, select, button, textarea { font: inherit; }
  input, select {
    width: 100%; padding: 7px 9px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--input); color: var(--fg);
  }
  input:focus, select:focus { outline: 2px solid color-mix(in srgb, var(--accent) 35%, transparent); border-color: var(--accent); }
  button {
    border: 1px solid var(--line); background: var(--card); color: var(--fg);
    border-radius: 7px; padding: 7px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .55; cursor: default; }
  .row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .row > .grow { flex: 1 1 220px; }
  .actions { margin-top: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .hint { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  .warnbar { border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line)); background: color-mix(in srgb, var(--warn) 10%, transparent); color: var(--fg); border-radius: 8px; padding: 9px 12px; font-size: 13px; margin-bottom: 12px; }
  .warnbar[hidden] { display: none; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 8px; border-top: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 12px; color: var(--muted); font-weight: 500; border-top: 0; }
  td.mono, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  .clip { color: var(--muted); word-break: break-all; }
  .empty { padding: 18px 8px; color: var(--muted); text-align: center; }
  .table-wrap { overflow-x: auto; }
  dialog { border: 0; padding: 0; background: transparent; color: var(--fg); max-width: min(92vw, 560px); width: 100%; }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  .sheet { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .sheet h3 { margin: 0 0 4px; font-size: 15px; }
  .qrbox { background: #fff; border-radius: 10px; padding: 10px; display: flex; justify-content: center; margin: 12px 0; }
  .qrbox svg { width: min(320px, 70vw); height: auto; }
  pre.config {
    margin: 0; padding: 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--input); max-height: 220px; overflow: auto; white-space: pre-wrap; word-break: break-all;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    background: var(--fg); color: var(--bg); border-radius: 8px; padding: 9px 14px;
    font-size: 13px; max-width: 90vw; z-index: 20; box-shadow: 0 8px 24px rgba(0,0,0,.18);
  }
  .toast[data-kind="error"] { background: var(--danger); color: #fff; }
  .toast[hidden] { display: none; }
  @media (max-width: 640px) {
    th.pub, td.pub { display: none; }
  }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>WireGuard 隧道</h1>
      <div class="muted">配置、多个 peer 和客户端二维码都在这里管理。</div>
    </div>
    <div class="pill"><span id="status-dot" class="dot"></span><span id="status-text">连接中…</span></div>
  </header>

  <div id="endpoint-warning" class="warnbar" hidden>
    还没填“客户端连接地址”。填好并保存后才能生成可用的客户端配置。
  </div>

  <div class="grid cards" style="margin-bottom:16px">
    <div class="stat"><div class="label">接口</div><div class="value" id="stat-iface">—</div></div>
    <div class="stat"><div class="label">监听端口</div><div class="value mono" id="stat-port">—</div></div>
    <div class="stat"><div class="label">Peer 数</div><div class="value" id="stat-peers">—</div></div>
    <div class="stat"><div class="label">服务端公钥</div><div class="value mono clip" id="stat-pub">—</div></div>
  </div>

  <section class="card">
    <h2>隧道设置</h2>
    <form id="settings-form" autocomplete="off">
      <div class="form-grid">
        <div>
          <label for="lan_interface">内网接口</label>
          <input id="lan_interface" name="lan_interface" placeholder="br0" required>
        </div>
        <div>
          <label for="port">监听端口（UDP）</label>
          <input id="port" name="port" type="number" min="1" max="65535" required>
        </div>
        <div>
          <label for="network">隧道网段（/24）</label>
          <input id="network" name="network" placeholder="10.99.0.0/24" required>
        </div>
        <div>
          <label for="address">服务端隧道地址</label>
          <input id="address" name="address" placeholder="10.99.0.1" required>
        </div>
        <div>
          <label for="mtu">MTU</label>
          <input id="mtu" name="mtu" type="number" min="576" max="1500" required>
        </div>
        <div>
          <label for="table">策略路由表号</label>
          <input id="table" name="table" type="number" min="1" max="65535" required>
        </div>
        <div>
          <label for="endpoint">客户端连接地址</label>
          <input id="endpoint" name="endpoint" placeholder="vpn.example.com 或 1.2.3.4:51820">
          <p class="hint">客户端二维码里的 Endpoint。写 host 时自动补监听端口。</p>
        </div>
        <div>
          <label for="dns">客户端 DNS（可选）</label>
          <input id="dns" name="dns" placeholder="1.1.1.1,8.8.8.8">
        </div>
        <div>
          <label for="allowed_ips_mode">客户端 AllowedIPs</label>
          <select id="allowed_ips_mode">
            <option value="all">全部流量（0.0.0.0/0, ::/0）</option>
            <option value="custom">自定义</option>
          </select>
          <input id="allowed_ips" name="allowed_ips" class="mono" style="margin-top:6px" placeholder="10.99.0.0/24,192.168.5.0/24">
        </div>
        <div>
          <label for="keepalive">PersistentKeepalive（秒）</label>
          <input id="keepalive" name="keepalive" type="number" min="0" max="65535">
        </div>
      </div>
      <div class="actions">
        <button class="primary" id="save" type="submit">保存设置</button>
        <span class="hint" id="save-hint">改接口 / 端口 / 网段 / 地址 / MTU 会重建 wg0，现有连接会短暂断开。</span>
      </div>
    </form>
  </section>

  <section class="card">
    <h2>Peers <span class="muted" id="peer-count" style="font-weight:400"></span></h2>
    <form id="add-form" class="row" autocomplete="off">
      <div class="grow">
        <label for="peer-name">新增 peer</label>
        <input id="peer-name" placeholder="手机 / 笔记本 / 名字" maxlength="64" required>
      </div>
      <button class="primary" id="add" type="submit">添加并生成二维码</button>
    </form>
    <p class="hint">每个 peer 会自动分配隧道地址、生成客户端密钥；添加后立即出现二维码，扫码即可导入 WireGuard 客户端。</p>
    <div class="table-wrap" style="margin-top:10px">
      <table>
        <thead>
          <tr><th>名称</th><th>隧道地址</th><th class="pub">公钥</th><th style="width:1%"></th></tr>
        </thead>
        <tbody id="peers"></tbody>
      </table>
    </div>
  </section>
</div>

<dialog id="peer-dialog">
  <div class="sheet">
    <h3 id="dialog-title">客户端配置</h3>
    <div class="muted" id="dialog-sub"></div>
    <div class="qrbox" id="qr"></div>
    <pre class="config" id="config-text"></pre>
    <div class="actions">
      <button class="primary" id="copy-config" type="button">复制配置</button>
      <button id="download-config" type="button">下载 .conf</button>
      <button id="close-dialog" type="button">关闭</button>
    </div>
  </div>
</dialog>

<div id="toast" class="toast" hidden></div>

<script src="qrcode.js"></script>
<script type="module" src="app.js"></script>
</html>

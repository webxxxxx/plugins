name: build

# 这个文件属于插件项目本身：插件独立成仓库后，它就是该插件的 CI。
# 平台列表来自 .plugin.json；没写 platforms 的插件视为 7 个平台通用，全部构建。

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platforms:
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        name: Read the declared platforms
        run: |
          set -euo pipefail
          list=$(jq -c '.ci.platforms // .platforms // []' .plugin.json 2>/dev/null || echo '[]')
          if [ -z "$list" ] || [ "$list" = "[]" ]; then
            list='["x86_64-unknown-linux-musl","aarch64-unknown-linux-musl","armv7-unknown-linux-musleabihf","x86_64-unknown-linux-gnu","x86_64-pc-windows-msvc","aarch64-apple-darwin","x86_64-apple-darwin"]'
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"

  build:
    name: build / ${{ matrix.platform }}
    needs: platforms
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.platforms.outputs.list) }}
    runs-on: ${{ contains(matrix.platform, 'windows') && 'windows-2025' || contains(matrix.platform, 'darwin') && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform }}
      - name: Install plugin-tools
        shell: bash
        run: |
          set -euo pipefail
          # The crate lives in tools/cli; cargo install --git does not look in subdirectories.
          git clone --depth 1 https://github.com/webxxxxx/plugins "$RUNNER_TEMP/plugins"
          cargo install --locked --path "$RUNNER_TEMP/plugins/tools/cli"
      - name: Install the musl cross toolchain
        if: contains(matrix.platform, 'musl')
        shell: bash
        # 同一份脚本仓库里也用：下 musl.cc 的包（带镜像回退），把链接器写进
        # $GITHUB_ENV / $GITHUB_PATH，后面的 cargo / gcc 直接吃到。
        run: sh "$RUNNER_TEMP/plugins/tools/cross/install.sh" "${{ matrix.platform }}"
      - name: Install the host plugin CLI
        shell: bash
        # plugin-tools 只编排，真正打包的是宿主的 `plugin bundle`。
        run: |
          set -euo pipefail
          cargo install --locked --git https://github.com/webxxxxx/plugin-manager --bin svcd
          mkdir -p "$HOME/.local/bin"
          # Windows 只按 plugin.exe 查找；复制成没有扩展名的 plugin 不会被执行。
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$(command -v svcd.exe || command -v svcd)" "$HOME/.local/bin/plugin.exe"
          else
            cp "$(command -v svcd)" "$HOME/.local/bin/plugin"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build and verify
        run: plugin-tools build --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: spk-${{ matrix.platform }}
          path: dist/*.spk
          if-no-files-found: error
          retention-days: 7